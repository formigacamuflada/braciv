name: Noticias

# Feeds publicos oficiais a cada 6 horas (noticias mudam mais que o resto).

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: grava-dados
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Coletar
        run: python coletores/noticias.py
      - name: Guardar
        run: |
          git config user.name "coletor"
          git config user.email "coletor@users.noreply.github.com"
          git add dados/noticias.json dados/noticias_fontes.txt
          git diff --staged --quiet || git commit -m "dados: noticias $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -q && git push

name: Explorar SIORG

# Reconhecimento: descobre quais endpoints do SIORG respondem.
# Nao grava dados, so relata no log da execucao.

on:
  workflow_dispatch:

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sondar endpoints
        run: python coletores/siorg_explorar.py

name: Explorar SIORG

# Reconhecimento: descobre quais endpoints do SIORG respondem.
# Grava o relatorio em dados/siorg_reconhecimento.txt e faz commit,
# porque o log da execucao nao e acessivel de onde trabalhamos.

on:
  workflow_dispatch:

jobs:
  explorar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sondar endpoints
        run: |
          mkdir -p dados
          python coletores/siorg_explorar.py 2>&1 | tee dados/siorg_reconhecimento.txt
      - name: Guardar relatorio
        run: |
          git config user.name "coletor"
          git config user.email "coletor@users.noreply.github.com"
          git add dados/siorg_reconhecimento.txt
          git diff --staged --quiet || git commit -m "siorg: relatorio de reconhecimento"
          git push

name: Convergencia entre cargos

# Quem foi eleito em 2022 e saiu (ou vai sair) para outro cargo: deputado estadual eleito prefeito
# em 2024, governador que renunciou para disputar outro cargo em 2026, deputado federal eleito
# para outro cargo em 2026. Cruza pelo CPF so na memoria (nao grava CPF). Roda 1 vez por dia.

on:
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

concurrency:
  group: grava-dados
  cancel-in-progress: false

jobs:
  convergencia:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Cruzar
        run: python coletores/convergencia.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "coletor"
          git config user.email "coletor@users.noreply.github.com"
          for f in dados/convergencia.json dados/convergencia_relatorio.txt; do [ -e "$f" ] && git add "$f"; done
          git diff --staged --quiet || git commit -m "dados: convergencia entre cargos"
          git pull --rebase -q && git push

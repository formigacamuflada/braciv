name: TSE (eleitos 2022)

# Governadores e deputados estaduais eleitos em 2022, com foto. Roda na mao (os dados
# de 2022 nao mudam); refazer so se o coletor mudar.

on:
  workflow_dispatch:

concurrency:
  group: grava-dados
  cancel-in-progress: false

jobs:
  tse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests pillow
      - name: Coletar
        run: python coletores/tse.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "coletor"
          git config user.email "coletor@users.noreply.github.com"
          git add dados/tse_eleitos_2022.json dados/tse_relatorio.txt dados/fotos/tse || true
          git diff --staged --quiet || git commit -m "dados: eleitos 2022 do TSE (governadores e deputados estaduais)"
          git pull --rebase -q && git push

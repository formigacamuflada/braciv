name: Judiciario (ministros e conselheiros)

# Ministros do STF, STJ, TST, TSE, STM e conselheiros do CNJ, com foto, pelos sites dos tribunais.
# Roda toda segunda-feira e quando chamado na mao.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

concurrency:
  group: judiciario
  cancel-in-progress: false

jobs:
  judiciario:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests beautifulsoup4 pillow
      - name: Coletar
        run: python coletores/judiciario.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "coletor"
          git config user.email "coletor@users.noreply.github.com"
          git add dados/judiciario.json dados/judiciario_relatorio.txt dados/fotos/jud || true
          git diff --staged --quiet || git commit -m "dados: ministros dos tribunais superiores e conselheiros do CNJ"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
